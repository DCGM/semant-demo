# Standalone Weaviate for building a corpus database with the scripts in this directory
# (README.md, "On server"). Not the local development environment: run the application
# locally with `make dev-up` (docs/DEVELOPMENT.md). Version: as deployed (docs/DEPLOYMENT.md).
services:
  weaviate:
    command:
    - --host
    - 0.0.0.0
    - --port
    - '8080'
    - --scheme
    - http
    image: cr.weaviate.io/semitechnologies/weaviate:1.40.1
    ports:
    - 8080:8080
    - 50051:50051
    volumes:
    - ./weaviate_db:/var/lib/weaviate
    restart: on-failure:0
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      ENABLE_API_BASED_MODULES: 'true'
      CLUSTER_HOSTNAME: 'node1'
      DISK_USE_READONLY_PERCENTAGE: 98
volumes:
  weaviate_data: