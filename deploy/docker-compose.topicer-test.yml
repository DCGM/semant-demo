services:
  # Not `topicer`: both Topicers are on semant_demo_embedder, where the service name is a DNS
  # alias, so the same name would let an app reach the other instance's Topicer (#473).
  topicer-test:
    # Named after TOPICER_VERSION below, so `docker ps` shows the running release.
    image: semant-demo-topicer:v0.1.0
    build:
      context: .
      dockerfile: ./Dockerfile.topicer
      target: server
      args:
        - NOW=${NOW}
        # Topicer release tag, also in `image` above; see README.md#topicer before changing it.
        - TOPICER_VERSION=v0.1.0
    env_file:
      - path: .env
        required: true
    environment:
      # Own config dir: only configs for the test Weaviate, and none that load models onto the GPU.
      TOPICER_API_CONFIGS_DIR: /app/data/topicer-test/configs
    # No host port: the test apps reach it over semant_demo_test_topicer (host 8090 is taken).
    networks:
      - semant_demo_test_topicer
      - semant_demo_embedder
      - semant_demo_test_database
    volumes:
    - './data:/app/data'
    restart: always
    command: "python run.py"

networks:
  semant_demo_test_topicer:
    name: semant_demo_test_topicer
    driver: bridge
    external: true
  semant_demo_test_database:
    name: semant_demo_test_database
    external: true
  semant_demo_embedder:
    name: semant_demo_embedder
    external: true
