services:
  app:
    restart: unless-stopped
    build:
      context: .
      target: backend
      dockerfile: Dockerfile
      args:
        - REPO=${REPO}
        - BRANCH=${BRANCH}
        - COMMIT=${COMMIT:-}
        - BACKEND_URL=${BACKEND_URL}
    env_file:
      - path: .env
        required: true
    environment:
      # Set here, next to the mount, so a stale .env cannot point the app at another file.
      SQL_DB_URL: sqlite+aiosqlite:////app/sql_data/tasks.db
      # The page asset store (#541) shared by all test instances, mounted read-only (#594).
      PAGE_ASSETS_DIR: /app/page_assets
    volumes:
      # The whole instance directory, not only tasks.db: SQLite keeps its rollback journal
      # (tasks.db-journal) beside the database and needs it after a crash (#406).
      - type: bind
        source: ${SQL_DB_PATH}
        target: /app/sql_data
        bind:
          create_host_path: false
      # In-app feedback log (FEEDBACK_LOG_PATH in the .env template), kept across container recreation.
      - type: bind
        source: ${SQL_DB_PATH}/feedback
        target: /app/feedback
        bind:
          create_host_path: false
      # Page scans, layout files, thumbnails and manifests, written by the page import on the
      # host (docs/DATA_MAINTENANCE.md); the application only reads them.
      - type: bind
        source: ${PAGE_ASSETS_PATH}
        target: /app/page_assets
        read_only: true
        bind:
          create_host_path: false
    networks:
      - web
      - semant_demo_test_database
      - semant_demo_embedder
      - semant_demo_test_topicer
    labels:
      - traefik.enable=true
      - traefik.http.routers.${TEST_ROUTER_NAME}.rule=Host(`${TEST_SUBDOMAIN}`)
      - traefik.http.routers.${TEST_ROUTER_NAME}.entrypoints=websecure
      - traefik.http.routers.${TEST_ROUTER_NAME}.service=${TEST_ROUTER_NAME}
      - traefik.http.services.${TEST_ROUTER_NAME}.loadbalancer.server.port=8000
      # The public MCP endpoint (docs/MCP.md, #635) gets a per-client-IP rate limit: the longer
      # rule wins over the host router, so only /mcp passes this middleware. Over the limit, 429.
      - traefik.http.routers.${TEST_ROUTER_NAME}-mcp.rule=Host(`${TEST_SUBDOMAIN}`) && PathPrefix(`/mcp`)
      - traefik.http.routers.${TEST_ROUTER_NAME}-mcp.entrypoints=websecure
      - traefik.http.routers.${TEST_ROUTER_NAME}-mcp.service=${TEST_ROUTER_NAME}
      - traefik.http.routers.${TEST_ROUTER_NAME}-mcp.middlewares=${TEST_ROUTER_NAME}-mcp-ratelimit
      - traefik.http.middlewares.${TEST_ROUTER_NAME}-mcp-ratelimit.ratelimit.average=60
      - traefik.http.middlewares.${TEST_ROUTER_NAME}-mcp-ratelimit.ratelimit.period=1m
      - traefik.http.middlewares.${TEST_ROUTER_NAME}-mcp-ratelimit.ratelimit.burst=30

networks:
  web:
    external: true
  semant_demo_test_database:
    name: semant_demo_test_database
    external: true
  semant_demo_embedder:
    name: semant_demo_embedder
    external: true
  semant_demo_test_topicer:
    name: semant_demo_test_topicer
    external: true