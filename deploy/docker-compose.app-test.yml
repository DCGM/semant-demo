services:
  app:
    restart: unless-stopped
    build:
      context: .
      target: backend
      dockerfile: Dockerfile
      args:
        - REPO=${REPO}
        - BRANCH=${BRANCH}
        - COMMIT=${COMMIT:-}
        - BACKEND_URL=${BACKEND_URL}
    env_file:
      - path: .env
        required: true
    environment:
      # Set here, next to the mount, so a stale .env cannot point the app at another file.
      SQL_DB_URL: sqlite+aiosqlite:////app/sql_data/tasks.db
    volumes:
      # The whole instance directory, not only tasks.db: SQLite keeps its rollback journal
      # (tasks.db-journal) beside the database and needs it after a crash (#406).
      - type: bind
        source: ${SQL_DB_PATH}
        target: /app/sql_data
        bind:
          create_host_path: false
      # In-app feedback log (FEEDBACK_LOG_PATH in the .env template), kept across container recreation.
      - type: bind
        source: ${SQL_DB_PATH}/feedback
        target: /app/feedback
        bind:
          create_host_path: false
    networks:
      - web
      - semant_demo_test_database
      - semant_demo_embedder
      - semant_demo_test_topicer
    labels:
      - traefik.enable=true
      - traefik.http.routers.${TEST_ROUTER_NAME}.rule=Host(`${TEST_SUBDOMAIN}`)
      - traefik.http.routers.${TEST_ROUTER_NAME}.entrypoints=websecure
      - traefik.http.services.${TEST_ROUTER_NAME}.loadbalancer.server.port=8000

networks:
  web:
    external: true
  semant_demo_test_database:
    name: semant_demo_test_database
    external: true
  semant_demo_embedder:
    name: semant_demo_embedder
    external: true
  semant_demo_test_topicer:
    name: semant_demo_test_topicer
    external: true