services:
  topicer:
    hostname: topicer
    # Named after TOPICER_VERSION below, so `docker ps` shows the running release.
    image: semant-demo-topicer:v0.1.0
    build:
      context: .
      dockerfile: ./Dockerfile.topicer
      target: server
      args:
        - NOW=${NOW}
        # Topicer release tag, also in `image` above; see README.md#topicer before changing it.
        - TOPICER_VERSION=v0.1.0
    env_file:
      - path: .env
        required: true
    ports:
    - "127.0.0.1:8089:8089"
    networks:
      - semant_demo_topicer
      - semant_demo_embedder
      - semant_demo_database
    volumes:
    - './data:/app/data'
    restart: always
    command: "python run.py"
    # CrossBERT and mDeBERTa topicer configs run on the GPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

networks:
  semant_demo_topicer:
    name: semant_demo_topicer
    driver: bridge
    external: true
  semant_demo_database:
    name: semant_demo_database
    external: true
  semant_demo_embedder:
    name: semant_demo_embedder
    external: true
