services:
  topicer:
    hostname: topicer
    # Named after TOPICER_VERSION below, so `docker ps` shows the running release.
    image: semant-demo-topicer:v0.1.0
    build:
      context: .
      dockerfile: ./Dockerfile.topicer
      target: server
      args:
        - NOW=${NOW}
        # Topicer release tag, also in `image` above; see README.md#topicer before changing it.
        - TOPICER_VERSION=v0.1.0
    env_file:
      - path: .env
        required: true
    environment:
      # torch is unpinned in Topicer, so the image gets the newest one. torch 2.14 routes some ops
      # (mmBERT's rotary embeddings) to Triton kernels that need a C compiler at run time, which
      # the slim image lacks (HTTP 500 for crossbert-mmbert-2026-08, #140). This keeps PyTorch's
      # standard kernels.
      TORCH_DISABLE_NATIVE_JIT: "1"
    ports:
    - "127.0.0.1:8089:8089"
    # Only the apps' network: semANT sends Topicer text, so it reads no database and needs no
    # embedder (#792). Its configs must not name a db_connection (it would fail to connect).
    networks:
      - semant_demo_topicer
    volumes:
    - './data:/app/data'
    restart: always
    command: "python run.py"
    # CrossBERT and mDeBERTa topicer configs run on the GPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

networks:
  semant_demo_topicer:
    name: semant_demo_topicer
    driver: bridge
    external: true
