id: "xandry12_AdaptiveRagGeneratorOg_ollama_default_multiquery"
name: "OG Adaptive RAG with more adaptive approach using Gemma 3 12B with multi query and web search"
description: "RAG using Gemma 3 12B. It has problem with citations, it answers based on provided documents but sometimes will not cite. It supports history between messages and internet/web search using DuckDuckGo."
class_name: "AdaptiveRagGeneratorOg"
params:
  tier: "small"
  temperature: 0.0
  search_type : "hybrid"
  alpha: 0.5
  chunk_limit: 5
  qt_strategy : "multi_query"
  max_retries : 3
  web_search_enabled : True
  metadata_extraction_allowed : True
  self_reflection : True
