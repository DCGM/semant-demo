# Search vectors (#217): the Weaviate named vectors of the chunk collection that vector and
# hybrid search (and RAG retrieval) may query, and how each one embeds its query.
# Loaded at startup from SEARCH_VECTORS_CONFIG; this file is the default and the
# configuration of production and the test instances (deploy/.env*.example). Fields:
# features/search/vectors.py.
#
# A vector must exist in the collection and be populated offline (data_tools/embedder,
# #192) before it is listed here (a query for a missing target vector fails). Clients select
# a vector by `id` (GET /api/search/vectors); a request without a selection uses `default`.
# Keys are never stored here: an `openai` embedding sends EMBEDDING_API_KEY when it is set.
#
# Only the Qwen vector (#385): the Gemma embedding service is stopped and there is no
# fallback to the old `default` vector; search_vectors_gemma.yaml configures that one.
# The served model, revision and URL are those of deploy/docker-compose.embedder.yml
# (`qwen-embedder`); the chunk vectors are written by data_tools/embedder with the same
# model and the plain chunk text (input_template `{{ text }}`, no document instruction).

default: qwen3-embedding-0.6b

vectors:
  - id: qwen3-embedding-0.6b
    name: Qwen3 Embedding 0.6B
    description: Chunk text embedded with Qwen/Qwen3-Embedding-0.6B (1,024 dimensions).
    target_vector: Qwen3_Embedding_0_6B
    embedding:
      provider: openai
      base_url: http://qwen-embedder:8000/v1
      model: Qwen/Qwen3-Embedding-0.6B
      # Qwen3-Embedding query format (model card); documents and HyDE passages have no instruction.
      query_prefix: "Instruct: Given a web search query, retrieve relevant passages that answer the query\nQuery:"
      document_prefix: ""
      # The model has no Matryoshka support in vLLM: `dimensions` must stay unset.
      timeout: 36.0
