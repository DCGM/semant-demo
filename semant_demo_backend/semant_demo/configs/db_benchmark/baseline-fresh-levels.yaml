name: baseline-fresh-levels
description: baseline hybrid and context scenarios with disjoint (fresh) inputs per
  concurrency level
seed: 374
concurrency:
- 1
- 5
- 10
requests_per_point: 40
max_seconds_per_point: 20
warmup_requests: 5
timeout: 30
max_qps: 20
pause_between_points: 2
queries:
  sample_objects: 150
  terms_per_query: 2
  year_ranges:
  - - 1900
    - 1920
  - - 1800
    - 1850
  - - 1940
    - 1952
  languages:
  - ces
  - deu
  sample_tags: 20
  sample_user_collections: 10
scenarios:
- name: hybrid
  kind: search
  mode: hybrid
  alpha: 0.5
  description: Search page default and RAG retrieval (hybrid, alpha 0.5, 10 chunks)
- name: hybrid_year
  kind: search
  mode: hybrid
  filter: year_range
  description: Hybrid + chunk yearIssued range filter
- name: hybrid_language
  kind: search
  mode: hybrid
  filter: language
  description: Hybrid + chunk language filter
- name: hybrid_direct
  kind: direct
  mode: hybrid
  alpha: 0.5
  description: Hybrid without references
- name: chunk_context
  kind: context
  context_chunks: 2
  description: Two chunks before and after a chunk (span chat / context)
level_inputs: disjoint
