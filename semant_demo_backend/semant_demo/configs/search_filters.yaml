- id: year_range
  name: Year range
  type: interval
  description: It is filter for text chunks stored in Chunks collection, which are
    associated with document having yearIssued property value belonging to the given
    interval.
  target_property: yearIssued
  values: null
  min_value: 318
  max_value: 2883
