# OpenRouter-hosted LLM tiers, selected by desk review on 2026-10-16 (#372).
# All active tiers use the existing OpenAI-compatible provider adapter, whose
# endpoint is OPENAI_API_URL (default: https://openrouter.ai/api/v1).
# Prices are estimated USD per million input/output tokens, not quota enforcement.
# These are currently listed base prices; routed-provider pricing, long-context
# surcharges, reasoning output and promotional discounts may change. A cost reported
# by OpenRouter for a call (usage.cost) is preferred to them. A self-hosted tier sets
# `price_basis: local_rate` and both prices: a USD-equivalent accounting rate, not a bill.
# See docs/LLM_MODEL_SELECTION_2026-10.md for evidence and trade-offs.
#
# The tier also defines OpenRouter's reasoning request field (enabled/effort/exclude).
# If supports_temperature is false, the gateway omits sampling temperature even
# when older feature code requests a value (required for current Claude 5.5).
tiers:
  tiny:
    # Frequent search-result titles and summaries; prioritize fast visible text.
    provider: openai
    model: anthropic/claude-haiku-5.5
    reasoning:
      enabled: false
    supports_temperature: false
    input_price: 0.10
    output_price: 0.50
  small:
    # Basic RAG and snippet-grounded questions; low-effort thinking.
    provider: openai
    model: anthropic/claude-haiku-5.5
    reasoning:
      effort: low
      exclude: true
    supports_temperature: false
    input_price: 0.10
    output_price: 0.50
  medium:
    # Interactive span chat and default multi-call agentic RAG.
    # OpenRouter displays a 50% promotional price (2026-10-16): $0.75/$3.75.
    # Keep the normal $1.50/$7.50 list price for conservative cost estimates.
    provider: openai
    model: google/gemini-3.8-flash
    capabilities: [tools]
    reasoning:
      effort: low
      exclude: true
    input_price: 1.50
    output_price: 7.50
  large:
    # Optional premium RAG; not the default for multi-call workflows.
    provider: openai
    model: anthropic/claude-sonnet-5.5
    capabilities: [tools]
    reasoning:
      effort: low
      exclude: true
    supports_temperature: false
    input_price: 2.00
    output_price: 10.00

# Feature defaults are server-controlled. RAG YAML configurations may select a
# permitted tier; browsers cannot select arbitrary models. Topicer is separate.
#
# limits (server-side; clients cannot raise them):
#   max_output_tokens: cap of one call's max_tokens, reasoning tokens included
#   max_input_tokens:  one call's input estimated at ~4 characters per token;
#                      a larger call is refused before it is sent
#   max_calls:         model calls of one user-visible operation (a search's
#                      titles/summaries, one RAG answer or explanation)
features:
  search_summary:
    default: tiny
    allowed: [tiny]
    limits:
      max_output_tokens: 1024
      # The results summary may cover all (up to 50) shown results.
      max_input_tokens: 32000
      # Titles and per-result summaries of up to 10 results, plus the results summary.
      max_calls: 21
  document_summary:
    default: tiny
    allowed: [tiny]
    limits:
      max_output_tokens: 1536
      # Up to chunk_limit (40) chunks of one document.
      max_input_tokens: 48000
      max_calls: 1
  question:
    default: small
    allowed: [small]
    limits:
      max_output_tokens: 512
      max_input_tokens: 32000
      max_calls: 1
  span_chat:
    default: medium
    allowed: [medium]
    limits:
      max_output_tokens: 1536
      max_input_tokens: 16000
      max_calls: 1
  rag:
    default: medium
    allowed: [small, medium, large]
    limits:
      max_output_tokens: 3072
      max_input_tokens: 24000
      # Adaptive RAG: up to 3 retrieval rounds, each grading up to 10 documents.
      max_calls: 60
