# Server-side LLM model tiers (read from LLM_MODELS_CONFIG; see docs/ARCHITECTURE.md).
#
# Clients never name a model. Each feature uses its default tier; a RAG configuration
# may choose another tier its feature allows (params.tier).
#
# Tier fields:
#   provider      openai (any OpenAI-compatible endpoint: OpenAI, OpenRouter), ollama, google
#   model         the provider's model identifier (OpenRouter names, e.g. openai/gpt-4.1-mini,
#                 for the default OPENAI_API_URL)
#   base_url      optional endpoint for this tier; otherwise OPENAI_API_URL or the first
#                 OLLAMA_URLS entry. Keys always come from OPENAI_API_KEY / GOOGLE_API_KEY.
#   capabilities  [tools] when the model supports function calling
#   input_price / output_price
#                 estimated USD per million tokens, used only for cost estimates;
#                 leave out when unknown (the cost is then not reported)
tiers:
  tiny:
    # Self-hosted, no per-token cost.
    provider: ollama
    model: qwen2.5:32b-instruct
    base_url: http://athena19.fit.vutbr.cz:11431
    input_price: 0
    output_price: 0
  small:
    provider: openai
    model: google/gemma-3-12b-it
  medium:
    provider: openai
    model: openai/gpt-4.1-mini
    capabilities: [tools]
    input_price: 0.40
    output_price: 1.60
  large:
    provider: openai
    model: openai/gpt-5.1
    capabilities: [tools]
    input_price: 1.25
    output_price: 10.00

# Features and the tiers they may use (`allowed` defaults to just the default tier).
features:
  search_summary:   # result titles, per-result and overall search summaries
    default: tiny
    allowed: [tiny]
  document_summary: # POST /api/user_collections/{collection_id}/documents/{document_id}/summary
    default: tiny
    allowed: [tiny]
  question:         # POST /api/question
    default: medium
    allowed: [medium]
  span_chat:        # POST /api/ai/discuss_span
    default: medium
    allowed: [medium]
  rag:              # RAG configurations choose with params.tier
    default: large
    allowed: [small, medium, large]
