# Contextual vector of span annotations (#328): loaded at startup from
# ANNOTATION_VECTOR_CONFIG (an empty value configures none); this file is the default and
# the configuration of production and the test instances (deploy/.env*.example). Fields:
# features/annotations/enrichment.py.
#
# Each annotation's vector embeds `template` with its left context, annotated text and
# right context (features/annotations/derivation.py), so the span is marked within its
# neighborhood; tag, type and AI metadata are not embedded. Queries use the same model's
# query embedding: the Qwen embedder of search_vectors_qwen.yaml (#385).
#
# `id` is stored with every vector. Change it whenever the model, its dimensions or
# prefixes, or the template change: vectors of another id are not current, semantic search
# leaves them out and `annotation_enrichment backfill` replaces them.
#
# Nothing is stored until the annotation collection has the derived properties and the
# named vector `target_vector` (`python -m semant_demo.maintenance.annotation_enrichment
# add-schema`, docs/DATA_MAINTENANCE.md).

id: qwen3-embedding-0.6b-context-v1
target_vector: contextual
template: "{left}<<<{text}>>>{right}"
max_input_chars: 2048
embedding:
  provider: openai
  base_url: http://qwen-embedder:8000/v1
  model: Qwen/Qwen3-Embedding-0.6B
  # The query format of search_vectors_qwen.yaml; annotation contexts have no instruction.
  query_prefix: "Instruct: Given a web search query, retrieve relevant passages that answer the query\nQuery:"
  document_prefix: ""
  timeout: 36.0
