[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "semantdemobackend"
dynamic = ["dependencies"]
version = "0.0.1"
requires-python = ">=3.12"
authors = [
  {name = "Michal Hradiš"},
  {name = "Martin Dočekal"},
]
description = "Backend for demo of SemANT."
readme = "README.md"
keywords = ["SemANT", "backend", "api"]

[project.urls]
Repository = "https://github.com/DCGM/semant-demo"

#[project.scripts]
#semantdemobackend = "semantdemobackend.__main__:main"

[tool.setuptools.packages.find]
include = ["semant_demo*"]
exclude = ["tests*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "integration: requires isolated local infrastructure",
  "live: explicitly authorized external provider test",
  "benchmark: controlled performance measurement",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Syntax errors, undefined names and unused imports. The wider default rule set reports
# legacy findings (star imports, comparisons, long lines); widen it as code is cleaned up.
select = ["E9", "F63", "F7", "F82", "F401"]
