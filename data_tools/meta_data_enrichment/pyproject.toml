[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantmetaenricher"
version = "0.1.0"
description = "A configurable pipeline for metadata enrichment of Weaviate database records."
readme = "README.md"
authors = [
    { name = "Developer" }
]
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "classconfig>=1.0.17",
    "weaviate-client>=4.20.4",
    "openai>=2.0.0",
    "transformers>=4.0.0",
    "tqdm>=4.0.0",
    "PyYAML>=6.0",
    "jinja2>=3.0.0"
]

[project.scripts]
semantmetaenricher = "semantmetaenricher.__main__:main"

[tool.setuptools]
packages = ["semantmetaenricher"]

# Linted by `make check` (`make check-classifier`) and CI (#676). The backend selects a narrower
# set only because of its legacy findings; this tool meets Ruff's default rule set, so it keeps
# it (pinned here so that a Ruff upgrade does not change the policy silently).
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
