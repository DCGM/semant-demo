name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: ["v*.*.*"]   
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.event.action != 'closed' }}

jobs:
  # Fast offline checks (see `make check`). These jobs are blocking: a failure fails the
  # workflow and prevents the production and test-main deployments below. They use no
  # secrets, API keys, GPU or live services.
  test-backend:
    name: Backend tests
    if: github.event.action != 'closed' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, semant-ci]
    container:
      image: python:3.12
      options: --user 1025:1027 -v ${{ vars.CI_PIP_CACHE_DIR || '/var/cache/semant-ci/pip' }}:/pip-cache
    env:
      HOME: /tmp
      PIP_CACHE_DIR: /pip-cache
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up virtual environment
        run: python -m venv /tmp/venv
      # The pip cache is shared by the CI runners on this host (setup: deploy/README.md)
      # and is trusted: only these CI jobs write to it. --require-hashes checks every
      # downloaded archive against the lock, also when pip's HTTP cache serves it; a wheel
      # pip built locally from an sdist is reused after checking only the source hash
      # recorded with it in the cache. All locked packages currently install from wheels.
      # pip silently downloads without a cache it cannot write, so check that first.
      # --no-compile: this venv is used once; skipping .pyc precompilation saves ~20 s.
      - name: Install pinned dependencies
        working-directory: semant_demo_backend
        run: |
          if probe=$(mktemp -p "$PIP_CACHE_DIR" .write-probe.XXXXXX 2>/dev/null); then
            rm -f "$probe"
            echo "pip cache $PIP_CACHE_DIR is writable by $(id -u):$(id -g)"
          else
            echo "::warning title=pip cache unavailable::$PIP_CACHE_DIR is not writable by $(id -u):$(id -g) ($(ls -ldn "$PIP_CACHE_DIR" 2>&1)); installing without the cache. See deploy/README.md."
          fi
          /tmp/venv/bin/pip install --require-hashes --no-compile -r requirements-dev.lock
          /tmp/venv/bin/pip install --no-compile --no-deps -e .
      - name: Lint
        working-directory: semant_demo_backend
        run: /tmp/venv/bin/ruff check .
      - name: Export OpenAPI schema
        working-directory: semant_demo_backend
        run: /tmp/venv/bin/python export_openapi.py --output openapi.json
      - name: Upload OpenAPI schema
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openapi-schema
          path: semant_demo_backend/openapi.json
          if-no-files-found: error
          retention-days: 3
      - name: Run fast tests
        working-directory: semant_demo_backend
        run: /tmp/venv/bin/pytest -m "not integration and not live and not benchmark" -v --junitxml=test-results.xml

      - name: Publish test results
        if: always()
        continue-on-error: true # reporting only; the test step above is the gate
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Backend test results
          path: semant_demo_backend/test-results.xml
          reporter: java-junit
          fail-on-error: false

  test-frontend:
    name: Frontend checks
    if: github.event.action != 'closed' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, semant-ci]
    container:
      image: node:22
      options: --user 1025:1027
    env:
      HOME: /tmp
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        working-directory: semant_demo_frontend
        run: npm ci
      - name: Lint
        working-directory: semant_demo_frontend
        run: npm run lint
      - name: Type check
        working-directory: semant_demo_frontend
        run: npm run typecheck
      - name: Unit and component tests
        working-directory: semant_demo_frontend
        run: npm test

  # Real-Weaviate tests (see `make test-integration`). The Weaviate service container is
  # created for this job only and has no volume; the tests additionally refuse any
  # instance that holds data they did not create. No secrets, API keys or live services.
  test-integration:
    name: Integration tests
    if: github.event.action != 'closed' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, semant-ci]
    container:
      image: python:3.12
      options: --user 1025:1027 -v ${{ vars.CI_PIP_CACHE_DIR || '/var/cache/semant-ci/pip' }}:/pip-cache
    services:
      weaviate:
        # Same version as the deployed and local development Weaviate.
        image: cr.weaviate.io/semitechnologies/weaviate:1.34.4
        env:
          QUERY_DEFAULTS_LIMIT: 25
          AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
          PERSISTENCE_DATA_PATH: /var/lib/weaviate
          DEFAULT_VECTORIZER_MODULE: none
          CLUSTER_HOSTNAME: node1
          DISABLE_TELEMETRY: "true"
    env:
      HOME: /tmp
      PIP_CACHE_DIR: /pip-cache
      SEMANT_TEST_WEAVIATE_HOST: weaviate
      SEMANT_TEST_WEAVIATE_REST_PORT: 8080
      SEMANT_TEST_WEAVIATE_GRPC_PORT: 50051
      # The service is reached by its job-network name, not loopback.
      SEMANT_TEST_WEAVIATE_ALLOW_NONLOCAL: "1"
      # Ownership token unique to this run attempt and job (see tests/weaviate_store.py).
      SEMANT_TEST_STORE_TOKEN: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up virtual environment
        run: python -m venv /tmp/venv
      # The pip cache is shared by the CI runners on this host (setup: deploy/README.md)
      # and is trusted: only these CI jobs write to it. --require-hashes checks every
      # downloaded archive against the lock, also when pip's HTTP cache serves it; a wheel
      # pip built locally from an sdist is reused after checking only the source hash
      # recorded with it in the cache. All locked packages currently install from wheels.
      # pip silently downloads without a cache it cannot write, so check that first.
      # --no-compile: this venv is used once; skipping .pyc precompilation saves ~20 s.
      - name: Install pinned dependencies
        working-directory: semant_demo_backend
        run: |
          if probe=$(mktemp -p "$PIP_CACHE_DIR" .write-probe.XXXXXX 2>/dev/null); then
            rm -f "$probe"
            echo "pip cache $PIP_CACHE_DIR is writable by $(id -u):$(id -g)"
          else
            echo "::warning title=pip cache unavailable::$PIP_CACHE_DIR is not writable by $(id -u):$(id -g) ($(ls -ldn "$PIP_CACHE_DIR" 2>&1)); installing without the cache. See deploy/README.md."
          fi
          /tmp/venv/bin/pip install --require-hashes --no-compile -r requirements-dev.lock
          /tmp/venv/bin/pip install --no-compile --no-deps -e .
      - name: Wait for Weaviate
        run: |
          for _ in $(seq 1 60); do
            curl -fsS http://weaviate:8080/v1/.well-known/ready && exit 0
            sleep 2
          done
          echo "Weaviate service did not become ready" >&2
          exit 1
      - name: Run integration tests
        working-directory: semant_demo_backend
        run: /tmp/venv/bin/pytest -m integration -v --durations=25

  api-client-drift:
    name: Generated API client drift
    needs: [test-backend]
    if: github.event.action != 'closed' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, semant-ci]
    container:
      # Same generator version as semant_demo_frontend/openapitools.json.
      image: openapitools/openapi-generator-cli:v7.20.0
      options: --user 1025:1027
    env:
      HOME: /tmp
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download OpenAPI schema
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openapi-schema
          path: /tmp/openapi-schema
      - name: Compare generated client
        env:
          OPENAPI_JSON: /tmp/openapi-schema/openapi.json
          OPENAPI_GENERATOR: java -jar /opt/openapi-generator/modules/openapi-generator-cli/target/openapi-generator-cli.jar
        run: bash semant_demo_frontend/scripts/api-client.sh check

  deploy-production:
    name: Deploy Production ${{ github.ref_name }}
    needs: [test-backend, test-frontend, test-integration, api-client-drift]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: [self-hosted, semant-server]
    environment: production
    timeout-minutes: 30

    env:
      # The one commit deployed: deploy files and the image source (COMMIT) both use it.
      DEPLOY_COMMIT: ${{ github.sha }}
    
    steps:
      - name: Checkout repository 
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_COMMIT }}
          fetch-depth: 0

      - name: Validate tag points to a commit contained in main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "ERROR: Tagged commit $GITHUB_SHA is not contained in origin/main" >&2
            exit 1
          fi
          echo "Tagged commit $GITHUB_SHA is contained in origin/main"

      - name: Validate SQL database directory
        run: |
          SQL_DB_DIR="${{ vars.SQL_DB_DIR }}"
          if [ ! -d "$SQL_DB_DIR" ]; then
            echo "ERROR: SQL database directory does not exist: $SQL_DB_DIR" >&2
            echo "Please create it with: sudo mkdir -p $SQL_DB_DIR && sudo chown runner $SQL_DB_DIR" >&2
            exit 1
          fi
          echo "SQL database directory validated: $SQL_DB_DIR"

      - name: Validate and prepare deploy directory
        run: |
          set -euo pipefail
          RUNNER_WORKDIR="${{ vars.RUNNER_WORKDIR }}"
          DEPLOY_SUBDIR="${{ vars.DEPLOY_SUBDIR }}"

          # Security: validate DEPLOY_SUBDIR before using it
          if [[ -z "$RUNNER_WORKDIR" ]] || [[ -z "$DEPLOY_SUBDIR" ]]; then
            echo "ERROR: RUNNER_WORKDIR and DEPLOY_SUBDIR variables must be set"
            exit 1
          fi

          if [[ "$DEPLOY_SUBDIR" == *".."* ]] || [[ "$DEPLOY_SUBDIR" == /* ]]; then
            echo "ERROR: DEPLOY_SUBDIR must be a relative directory name, not absolute or containing .."
            exit 1
          fi

          CANONICAL=$(cd "$RUNNER_WORKDIR" && pwd)
          FULL_PATH="$RUNNER_WORKDIR/$DEPLOY_SUBDIR"
          if [[ ! "$FULL_PATH" == "$CANONICAL"* ]]; then
            echo "ERROR: Full deploy path must be under RUNNER_WORKDIR=$RUNNER_WORKDIR"
            exit 1
          fi

          mkdir -p "$FULL_PATH"
          echo "Deploy directory validated and ready: $FULL_PATH"

      - name: Update deploy/ files
        run: |
          set -euo pipefail
          DEPLOY_PATH="${{ vars.RUNNER_WORKDIR }}/${{ vars.DEPLOY_SUBDIR }}"
          cd "$GITHUB_WORKSPACE"

          HEAD=$(git rev-parse HEAD)
          if [ "$HEAD" != "$DEPLOY_COMMIT" ]; then
            echo "ERROR: Checked out $HEAD, expected deploy commit $DEPLOY_COMMIT" >&2 ; exit 1
          fi

          if [ ! -f "deploy/docker-compose.app.yaml" ] || [ ! -f "deploy/Dockerfile" ] || [ ! -f "deploy/.env.example" ]; then
            echo "ERROR: Required files not found in deploy/ at $DEPLOY_COMMIT" >&2 ; exit 1
          fi

          cp deploy/docker-compose.app.yaml "$DEPLOY_PATH/"
          cp deploy/Dockerfile "$DEPLOY_PATH/"
          cp deploy/.env.example "$DEPLOY_PATH/"

      - name: Create .env
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          escape_sed_replacement() { printf '%s' "$1" | sed 's/[&|\\]/\\&/g'; }

          DEPLOY_PATH="${{ vars.RUNNER_WORKDIR }}/${{ vars.DEPLOY_SUBDIR }}"
          PREV_BRANCH=$(grep "^BRANCH=" "$DEPLOY_PATH/.env" 2>/dev/null | cut -d= -f2 || true)
          echo "PREV_BRANCH=${PREV_BRANCH}" >> "$GITHUB_ENV"
          PREV_COMMIT=$(grep "^COMMIT=" "$DEPLOY_PATH/.env" 2>/dev/null | cut -d= -f2 || true)
          echo "PREV_COMMIT=${PREV_COMMIT}" >> "$GITHUB_ENV"
          cp "$DEPLOY_PATH/.env.example" "$DEPLOY_PATH/.env"
          sed -i "s|^BRANCH=.*|BRANCH=${{ github.ref_name }}|" "$DEPLOY_PATH/.env"
          sed -i "s|^COMMIT=.*|COMMIT=${DEPLOY_COMMIT}|" "$DEPLOY_PATH/.env"
          sed -i "s|^SQL_DB_PATH=.*|SQL_DB_PATH=${{ vars.SQL_DB_DIR }}|" "$DEPLOY_PATH/.env"
          sed -i "s|^DOMAIN=.*|DOMAIN=${{ vars.BASE_DOMAIN }}|" "$DEPLOY_PATH/.env"
          sed -i "s|^BACKEND_URL=.*|BACKEND_URL=https://${{ vars.BASE_DOMAIN }}|" "$DEPLOY_PATH/.env"
          sed -i "s|^ALLOWED_ORIGIN=.*|ALLOWED_ORIGIN=https://${{ vars.BASE_DOMAIN }}|" "$DEPLOY_PATH/.env"
          sed -i "s|^OPENAI_API_KEY=.*|OPENAI_API_KEY=$(escape_sed_replacement "$OPENAI_API_KEY")|" "$DEPLOY_PATH/.env"
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(escape_sed_replacement "$JWT_SECRET")|" "$DEPLOY_PATH/.env"
          sed -i "s|^OTEL_ENABLED=.*|OTEL_ENABLED=true|" "$DEPLOY_PATH/.env"
          sed -i "s|^DEPLOYMENT_ENVIRONMENT=.*|DEPLOYMENT_ENVIRONMENT=production|" "$DEPLOY_PATH/.env"

      - name: Initialize SQLite database (first run only)
        run: |
          DEPLOY_PATH="${{ vars.RUNNER_WORKDIR }}/${{ vars.DEPLOY_SUBDIR }}"
          SQL_DB_PATH=$(grep "^SQL_DB_PATH=" "$DEPLOY_PATH/.env" | cut -d= -f2)

          if [ ! -d "$SQL_DB_PATH" ]; then
            mkdir -p "$SQL_DB_PATH"
            echo "Created new SQL database directory"
          else
            echo "SQL database directory already exists"
          fi

          if [ ! -f "$SQL_DB_PATH/tasks.db" ]; then
            touch "$SQL_DB_PATH/tasks.db"
            echo "Created new SQLite database"
          else
            echo "Using existing SQLite database"
          fi

      - name: Build and start
        id: build
        working-directory: ${{ vars.RUNNER_WORKDIR }}/${{ vars.DEPLOY_SUBDIR }}
        run: |
          OLD_BACKEND=$(docker compose -p semant-demo -f ./docker-compose.app.yaml images -q app 2>/dev/null || true)
          [ -n "$OLD_BACKEND" ] && docker tag "$OLD_BACKEND" semant-demo-rollback || true

          docker compose -p semant-demo -f ./docker-compose.app.yaml down --rmi local 2>/dev/null || true
          docker compose -p semant-demo -f ./docker-compose.app.yaml build --no-cache
          docker compose -p semant-demo -f ./docker-compose.app.yaml up -d

      - name: Health check
        id: health
        working-directory: ${{ vars.RUNNER_WORKDIR }}/${{ vars.DEPLOY_SUBDIR }}
        run: |
          DOMAIN=$(grep "^DOMAIN=" .env | cut -d= -f2)
          TEST_URL="https://${DOMAIN}/health"
          for i in $(seq 1 6); do
            sleep 10
            echo "Attempt $i/6..."
            if curl --fail --silent --max-time 10 "$TEST_URL"; then
              echo "Health check passed: $TEST_URL"
              docker rmi semant-demo-rollback 2>/dev/null || true
              docker image prune -f --filter label=project=semant-demo
              exit 0
            fi
          done
          echo "Health check failed after 6 attempts."
          exit 1

      - name: Rollback
        if: failure() && steps.health.outcome == 'failure'
        working-directory: ${{ vars.RUNNER_WORKDIR }}/${{ vars.DEPLOY_SUBDIR }}
        run: |
          PREV="${{ env.PREV_BRANCH }}"
          if [ -z "$PREV" ]; then echo "First deploy – skipping rollback."; exit 1; fi
          echo "Rolling back to $PREV..."

          BACKEND_IMG=$(docker compose -p semant-demo -f ./docker-compose.app.yaml images app --format json 2>/dev/null \
            | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['Image'])" 2>/dev/null || true)
          [ -n "$BACKEND_IMG" ] && docker tag semant-demo-rollback "$BACKEND_IMG" || true

          sed -i "s|^BRANCH=.*|BRANCH=$PREV|" .env
          sed -i "s|^COMMIT=.*|COMMIT=${{ env.PREV_COMMIT }}|" .env
          docker compose -p semant-demo -f ./docker-compose.app.yaml up -d
          echo "Rollback complete."

  deploy-test-main:
    name: Deploy test-main
    needs: [test-backend, test-frontend, test-integration, api-client-drift]
    if: github.event_name == 'push' && github.ref_type != 'tag' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, semant-server]
    timeout-minutes: 30

    env:
      # The one commit deployed: deploy files and the image source (COMMIT) both use it.
      DEPLOY_COMMIT: ${{ github.sha }}

    steps:
      - name: Validate SQL database directory
        run: |
          SQL_DB_DIR="${{ vars.SQL_DB_DIR_TEST }}"
          if [ ! -d "$SQL_DB_DIR" ]; then
            echo "ERROR: SQL database directory does not exist: $SQL_DB_DIR" >&2
            echo "Please create it with: sudo mkdir -p $SQL_DB_DIR && sudo chown runner $SQL_DB_DIR" >&2
            exit 1
          fi
          echo "SQL database directory validated: $SQL_DB_DIR"

      - name: Validate and prepare deploy directory
        run: |
          set -euo pipefail
          RUNNER_WORKDIR="${{ vars.RUNNER_WORKDIR }}"
          DEPLOY_SUBDIR="${{ vars.DEPLOY_SUBDIR }}-test-main"

          if [[ -z "$RUNNER_WORKDIR" ]]; then
            echo "ERROR: RUNNER_WORKDIR must be set" ; exit 1
          fi

          CANONICAL=$(cd "$RUNNER_WORKDIR" && pwd)
          FULL_PATH="$RUNNER_WORKDIR/$DEPLOY_SUBDIR"
          if [[ ! "$FULL_PATH" == "$CANONICAL"* ]]; then
            echo "ERROR: Path traversal detected" ; exit 1
          fi

          if [ ! -d "$FULL_PATH" ]; then
            mkdir -p "$FULL_PATH"
            echo "Created deploy directory: $FULL_PATH"
          else
            echo "Deploy directory already exists: $FULL_PATH"
          fi

      - name: Check out deploy files at the deploy commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_COMMIT }}
          path: deploy-src
          sparse-checkout: deploy
          persist-credentials: false

      - name: Update deploy files
        run: |
          set -euo pipefail
          DEPLOY_PATH="${{ vars.RUNNER_WORKDIR }}/${{ vars.DEPLOY_SUBDIR }}-test-main"
          cd "$GITHUB_WORKSPACE/deploy-src"

          HEAD=$(git rev-parse HEAD)
          if [ "$HEAD" != "$DEPLOY_COMMIT" ]; then
            echo "ERROR: Checked out $HEAD, expected deploy commit $DEPLOY_COMMIT" >&2 ; exit 1
          fi

          if [ ! -f "deploy/docker-compose.app-test.yml" ] || [ ! -f "deploy/Dockerfile" ] || [ ! -f "deploy/.env.test.example" ]; then
            echo "ERROR: Required files not found in deploy/ at $DEPLOY_COMMIT" >&2 ; exit 1
          fi

          cp deploy/docker-compose.app-test.yml "$DEPLOY_PATH/"
          cp deploy/Dockerfile "$DEPLOY_PATH/"
          cp deploy/.env.test.example "$DEPLOY_PATH/"

      - name: Create .env
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          BASE_DOMAIN="${{ vars.BASE_DOMAIN }}"
          DEPLOY_PATH="${{ vars.RUNNER_WORKDIR }}/${{ vars.DEPLOY_SUBDIR }}-test-main"
          TEST_SUBDOMAIN="test-main.${BASE_DOMAIN}"
          TEST_ROUTER_NAME="semant-demo-test-main"
          SQL_DB_PATH="${{ vars.SQL_DB_DIR_TEST }}/test-main"

          escape_sed_replacement() { printf '%s' "$1" | sed 's/[&|\\]/\\&/g'; }

          cp "$DEPLOY_PATH/.env.test.example" "$DEPLOY_PATH/.env"
          sed -i "s|^BRANCH=.*|BRANCH=main|"                                                                                    "$DEPLOY_PATH/.env"
          sed -i "s|^COMMIT=.*|COMMIT=${DEPLOY_COMMIT}|"                                                                        "$DEPLOY_PATH/.env"
          sed -i "s|^TEST_SUBDOMAIN=.*|TEST_SUBDOMAIN=$(escape_sed_replacement "${TEST_SUBDOMAIN}")|"              "$DEPLOY_PATH/.env"
          sed -i "s|^TEST_ROUTER_NAME=.*|TEST_ROUTER_NAME=$(escape_sed_replacement "${TEST_ROUTER_NAME}")|"        "$DEPLOY_PATH/.env"
          sed -i "s|^BACKEND_URL=.*|BACKEND_URL=$(escape_sed_replacement "https://${TEST_SUBDOMAIN}")|"            "$DEPLOY_PATH/.env"
          sed -i "s|^ALLOWED_ORIGIN=.*|ALLOWED_ORIGIN=$(escape_sed_replacement "https://${TEST_SUBDOMAIN}")|"      "$DEPLOY_PATH/.env"
          sed -i "s|^SQL_DB_PATH=.*|SQL_DB_PATH=$(escape_sed_replacement "${SQL_DB_PATH}")|"                       "$DEPLOY_PATH/.env"
          sed -i "s|^OPENAI_API_KEY=.*|OPENAI_API_KEY=$(escape_sed_replacement "$OPENAI_API_KEY")|"  "$DEPLOY_PATH/.env"
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(escape_sed_replacement "$JWT_SECRET")|"  "$DEPLOY_PATH/.env"
          sed -i "s|^OTEL_ENABLED=.*|OTEL_ENABLED=true|" "$DEPLOY_PATH/.env"
          sed -i "s|^DEPLOYMENT_ENVIRONMENT=.*|DEPLOYMENT_ENVIRONMENT=test-main|" "$DEPLOY_PATH/.env"

          echo "Test URL: https://${TEST_SUBDOMAIN}"

      - name: Initialize SQLite database (first run only)
        run: |
          DEPLOY_PATH="${{ vars.RUNNER_WORKDIR }}/${{ vars.DEPLOY_SUBDIR }}-test-main"
          SQL_DB_PATH=$(grep "^SQL_DB_PATH=" "$DEPLOY_PATH/.env" | cut -d= -f2)
          
          if [ ! -d "$SQL_DB_PATH" ]; then
            mkdir -p "$SQL_DB_PATH"
            echo "Created new SQL database directory"
          else
            echo "SQL database directory already exists"
          fi
          
          if [ ! -f "$SQL_DB_PATH/tasks.db" ]; then
            touch "$SQL_DB_PATH/tasks.db"
            echo "Created new SQLite database"
          else
            echo "Using existing SQLite database"
          fi

      - name: Build and start
        run: |
          DEPLOY_PATH="${{ vars.RUNNER_WORKDIR }}/${{ vars.DEPLOY_SUBDIR }}-test-main"
          cd "$DEPLOY_PATH"
          docker compose -p "${{ vars.DEPLOY_SUBDIR }}-test-main" -f docker-compose.app-test.yml down --rmi local 2>/dev/null || true
          docker compose -p "${{ vars.DEPLOY_SUBDIR }}-test-main" -f docker-compose.app-test.yml build --no-cache
          docker compose -p "${{ vars.DEPLOY_SUBDIR }}-test-main" -f docker-compose.app-test.yml up -d

      - name: Health check
        run: |
          DEPLOY_PATH="${{ vars.RUNNER_WORKDIR }}/${{ vars.DEPLOY_SUBDIR }}-test-main"
          TEST_SUBDOMAIN=$(grep "^TEST_SUBDOMAIN=" "$DEPLOY_PATH/.env" | cut -d= -f2)
          TEST_URL="https://${TEST_SUBDOMAIN}/health"
          for i in $(seq 1 6); do
            sleep 10
            echo "Attempt $i/6..."
            if curl --fail --silent --max-time 10 "$TEST_URL"; then
              echo ""
              echo "Health check passed: $TEST_URL"
              exit 0
            fi
          done
          echo "Health check failed after 6 attempts."
          exit 1

  deploy-test-pr:
    name: "Deploy test PR #${{ github.event.pull_request.number }}"
    needs: [test-backend]
    if: always() && github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, semant-server]
    timeout-minutes: 30

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.head_ref }}
      # The one commit deployed: deploy files and the image source (COMMIT) both use it. This is
      # the PR head; the pull_request checks test GitHub's merge commit instead (#213).
      DEPLOY_COMMIT: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Validate SQL database directory
        run: |
          SQL_DB_DIR="${{ vars.SQL_DB_DIR_TEST }}"
          if [ ! -d "$SQL_DB_DIR" ]; then
            echo "ERROR: SQL database directory does not exist: $SQL_DB_DIR" >&2
            echo "Please create it with: sudo mkdir -p $SQL_DB_DIR && sudo chown runner $SQL_DB_DIR" >&2
            exit 1
          fi
          echo "SQL database directory validated: $SQL_DB_DIR"

      - name: Validate and prepare deploy directory
        run: |
          set -euo pipefail
          RUNNER_WORKDIR="${{ vars.RUNNER_WORKDIR }}"
          DEPLOY_SUBDIR="${{ vars.DEPLOY_SUBDIR }}-test-pr-${PR_NUMBER}"

          if [[ -z "$RUNNER_WORKDIR" ]]; then
            echo "ERROR: RUNNER_WORKDIR must be set" ; exit 1
          fi
          if [[ "$DEPLOY_SUBDIR" == *".."* ]] || [[ "$DEPLOY_SUBDIR" == /* ]]; then
            echo "ERROR: Invalid DEPLOY_SUBDIR" ; exit 1
          fi

          CANONICAL=$(cd "$RUNNER_WORKDIR" && pwd)
          FULL_PATH="$RUNNER_WORKDIR/$DEPLOY_SUBDIR"
          if [[ ! "$FULL_PATH" == "$CANONICAL"* ]]; then
            echo "ERROR: Path traversal detected" ; exit 1
          fi

          if [ ! -d "$FULL_PATH" ]; then
            mkdir -p "$FULL_PATH"
            echo "Created deploy directory: $FULL_PATH"
          else
            echo "Deploy directory already exists: $FULL_PATH"
          fi

      - name: Check out deploy files at the deploy commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_COMMIT }}
          path: deploy-src
          sparse-checkout: deploy
          persist-credentials: false

      - name: Update deploy files
        run: |
          set -euo pipefail
          DEPLOY_PATH="${{ vars.RUNNER_WORKDIR }}/${{ vars.DEPLOY_SUBDIR }}-test-pr-${PR_NUMBER}"
          cd "$GITHUB_WORKSPACE/deploy-src"

          HEAD=$(git rev-parse HEAD)
          if [ "$HEAD" != "$DEPLOY_COMMIT" ]; then
            echo "ERROR: Checked out $HEAD, expected deploy commit $DEPLOY_COMMIT" >&2 ; exit 1
          fi

          if [ ! -f "deploy/docker-compose.app-test.yml" ] || [ ! -f "deploy/Dockerfile" ] || [ ! -f "deploy/.env.test.example" ]; then
            echo "ERROR: Required files not found in deploy/ at $DEPLOY_COMMIT" >&2 ; exit 1
          fi

          cp deploy/docker-compose.app-test.yml "$DEPLOY_PATH/"
          cp deploy/Dockerfile "$DEPLOY_PATH/"
          cp deploy/.env.test.example "$DEPLOY_PATH/"

      - name: Create .env
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          BASE_DOMAIN="${{ vars.BASE_DOMAIN }}"
          DEPLOY_PATH="${{ vars.RUNNER_WORKDIR }}/${{ vars.DEPLOY_SUBDIR }}-test-pr-${PR_NUMBER}"
          TEST_SUBDOMAIN="test-pr-${PR_NUMBER}.${BASE_DOMAIN}"
          TEST_ROUTER_NAME="semant-demo-test-pr-${PR_NUMBER}"
          SQL_DB_PATH="${{ vars.SQL_DB_DIR_TEST }}/test-pr-${PR_NUMBER}"

          escape_sed_replacement() { printf '%s' "$1" | sed 's/[&|\\]/\\&/g'; }

          cp "$DEPLOY_PATH/.env.test.example" "$DEPLOY_PATH/.env"
          sed -i "s|^BRANCH=.*|BRANCH=$(escape_sed_replacement "${BRANCH}")|"                                      "$DEPLOY_PATH/.env"
          sed -i "s|^COMMIT=.*|COMMIT=${DEPLOY_COMMIT}|"                                                          "$DEPLOY_PATH/.env"
          sed -i "s|^TEST_SUBDOMAIN=.*|TEST_SUBDOMAIN=$(escape_sed_replacement "${TEST_SUBDOMAIN}")|"              "$DEPLOY_PATH/.env"
          sed -i "s|^TEST_ROUTER_NAME=.*|TEST_ROUTER_NAME=$(escape_sed_replacement "${TEST_ROUTER_NAME}")|"        "$DEPLOY_PATH/.env"
          sed -i "s|^BACKEND_URL=.*|BACKEND_URL=$(escape_sed_replacement "https://${TEST_SUBDOMAIN}")|"            "$DEPLOY_PATH/.env"
          sed -i "s|^ALLOWED_ORIGIN=.*|ALLOWED_ORIGIN=$(escape_sed_replacement "https://${TEST_SUBDOMAIN}")|"      "$DEPLOY_PATH/.env"
          sed -i "s|^SQL_DB_PATH=.*|SQL_DB_PATH=$(escape_sed_replacement "${SQL_DB_PATH}")|"                       "$DEPLOY_PATH/.env"
          sed -i "s|^OPENAI_API_KEY=.*|OPENAI_API_KEY=$(escape_sed_replacement "$OPENAI_API_KEY")|"  "$DEPLOY_PATH/.env"
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(escape_sed_replacement "$JWT_SECRET")|"  "$DEPLOY_PATH/.env"
          sed -i "s|^OTEL_ENABLED=.*|OTEL_ENABLED=true|" "$DEPLOY_PATH/.env"
          sed -i "s|^DEPLOYMENT_ENVIRONMENT=.*|DEPLOYMENT_ENVIRONMENT=test-pr-${PR_NUMBER}|" "$DEPLOY_PATH/.env"

          echo "Test URL: https://${TEST_SUBDOMAIN}"

      - name: Initialize SQLite database (first run only)
        run: |
          DEPLOY_PATH="${{ vars.RUNNER_WORKDIR }}/${{ vars.DEPLOY_SUBDIR }}-test-pr-${PR_NUMBER}"
          SQL_DB_PATH=$(grep "^SQL_DB_PATH=" "$DEPLOY_PATH/.env" | cut -d= -f2)
          
          if [ ! -d "$SQL_DB_PATH" ]; then
            mkdir -p "$SQL_DB_PATH"
            echo "Created new SQL database directory"
          else
            echo "SQL database directory already exists"
          fi

          if [ ! -f "$SQL_DB_PATH/tasks.db" ]; then
            touch "$SQL_DB_PATH/tasks.db"
            echo "Created new SQLite database"
          else
            echo "Using existing SQLite database"
          fi

      - name: Build and start
        run: |
          DEPLOY_PATH="${{ vars.RUNNER_WORKDIR }}/${{ vars.DEPLOY_SUBDIR }}-test-pr-${PR_NUMBER}"
          cd "$DEPLOY_PATH"
          docker compose -p "${{ vars.DEPLOY_SUBDIR }}-test-pr-${PR_NUMBER}" -f docker-compose.app-test.yml down --rmi local 2>/dev/null || true
          docker compose -p "${{ vars.DEPLOY_SUBDIR }}-test-pr-${PR_NUMBER}" -f docker-compose.app-test.yml build --no-cache
          docker compose -p "${{ vars.DEPLOY_SUBDIR }}-test-pr-${PR_NUMBER}" -f docker-compose.app-test.yml up -d

      - name: Health check
        run: |
          DEPLOY_PATH="${{ vars.RUNNER_WORKDIR }}/${{ vars.DEPLOY_SUBDIR }}-test-pr-${PR_NUMBER}"
          TEST_SUBDOMAIN=$(grep "^TEST_SUBDOMAIN=" "$DEPLOY_PATH/.env" | cut -d= -f2)
          TEST_URL="https://${TEST_SUBDOMAIN}/health"
          for i in $(seq 1 6); do
            sleep 10
            echo "Attempt $i/6..."
            if curl --fail --silent --max-time 10 "$TEST_URL"; then
              echo ""
              echo "Health check passed: $TEST_URL"
              exit 0
            fi
          done
          echo "Health check failed after 6 attempts."
          exit 1

  teardown-test-pr:
    name: "Teardown test PR #${{ github.event.pull_request.number }}"
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, semant-server]
    timeout-minutes: 10

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Stop and remove test instance
        run: |
          set -euo pipefail
          DEPLOY_PATH="${{ vars.RUNNER_WORKDIR }}/${{ vars.DEPLOY_SUBDIR }}-test-pr-${PR_NUMBER}"

          if [ ! -d "$DEPLOY_PATH" ]; then
            echo "No instance found at $DEPLOY_PATH, nothing to clean up."
            exit 0
          fi

          cd "$DEPLOY_PATH"
          docker compose -p "${{ vars.DEPLOY_SUBDIR }}-test-pr-${PR_NUMBER}" -f docker-compose.app-test.yml down --rmi local
          
          # Clean up SQLite database directory
          if [ -f "$DEPLOY_PATH/.env" ]; then
            SQL_DB_PATH=$(grep "^SQL_DB_PATH=" "$DEPLOY_PATH/.env" | cut -d= -f2)
            rm -rf "$SQL_DB_PATH"
          fi
          
          rm -rf "$DEPLOY_PATH"
          
          echo "Test instance for PR #${PR_NUMBER} removed."
