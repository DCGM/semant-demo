<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="640" viewBox="0 0 1260 640" role="img" aria-label="Explicit population comparison and data quality"><title>Explicit population comparison and data quality — synthetic illustrative mockups</title><rect x="0" y="0" width="1260" height="640" rx="0" fill="#F4F8FA"/><rect x="30" y="24" width="64" height="27" rx="6" fill="#18344A"/><text x="62" y="43" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle">semANT</text><text x="110" y="45" fill="#63788A" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="start">EXPLORE  /  VISUALIZATION CONCEPTS</text><text x="30" y="91" fill="#18344A" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start">Explicit population comparison and data quality</text><text x="1230" y="90" fill="#63788A" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="end">ILLUSTRATIVE · NOT ACTUAL DATA</text><rect x="30" y="117" width="587" height="468" rx="14" fill="#FFFFFF" stroke="#DCE6EB" stroke-width="1"/><text x="54" y="158" fill="#18344A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start">Compare two search or filter populations</text><text x="54" y="182" fill="#63788A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">Same metric, clear units and two explicitly saved scopes.</text><line x1="54" y1="199" x2="593" y2="199" stroke="#DCE6EB" stroke-width="1" /><rect x="643" y="117" width="587" height="468" rx="14" fill="#FFFFFF" stroke="#DCE6EB" stroke-width="1"/><text x="667" y="158" fill="#18344A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start">Coverage, missing, not computed</text><text x="667" y="182" fill="#63788A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">Show coverage before users interpret a classification chart.</text><line x1="667" y1="199" x2="1206" y2="199" stroke="#DCE6EB" stroke-width="1" /><rect x="57" y="221" width="13" height="13" rx="3" fill="#227A86"/><text x="77" y="233" fill="#18344A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">Population A</text><rect x="238" y="221" width="13" height="13" rx="3" fill="#8B73B7"/><text x="258" y="233" fill="#18344A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">Population B</text><text x="54" y="276" fill="#18344A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">Journalistic</text><line x1="200" y1="270" x2="520" y2="270" stroke="#DCE6EB" stroke-width="2" /><line x1="349.33333333333337" y1="270" x2="456" y2="270" stroke="#A9B9C6" stroke-width="3" /><circle cx="349.33333333333337" cy="270" r="7" fill="#227A86"/><circle cx="456" cy="270" r="7" fill="#8B73B7"/><text x="54" y="331" fill="#18344A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">Literary</text><line x1="200" y1="325" x2="520" y2="325" stroke="#DCE6EB" stroke-width="2" /><line x1="413.33333333333337" y1="325" x2="317.3333333333333" y2="325" stroke="#A9B9C6" stroke-width="3" /><circle cx="413.33333333333337" cy="325" r="7" fill="#227A86"/><circle cx="317.3333333333333" cy="325" r="7" fill="#8B73B7"/><text x="54" y="386" fill="#18344A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">Scholarly</text><line x1="200" y1="380" x2="520" y2="380" stroke="#DCE6EB" stroke-width="2" /><line x1="285.3333333333333" y1="380" x2="264" y2="380" stroke="#A9B9C6" stroke-width="3" /><circle cx="285.3333333333333" cy="380" r="7" fill="#227A86"/><circle cx="264" cy="380" r="7" fill="#8B73B7"/><text x="54" y="441" fill="#18344A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">Official</text><line x1="200" y1="435" x2="520" y2="435" stroke="#DCE6EB" stroke-width="2" /><line x1="253.33333333333334" y1="435" x2="264" y2="435" stroke="#A9B9C6" stroke-width="3" /><circle cx="253.33333333333334" cy="435" r="7" fill="#227A86"/><circle cx="264" cy="435" r="7" fill="#8B73B7"/><text x="54" y="496" fill="#18344A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">Other</text><line x1="200" y1="490" x2="520" y2="490" stroke="#DCE6EB" stroke-width="2" /><line x1="232" y1="490" x2="232" y2="490" stroke="#A9B9C6" stroke-width="3" /><circle cx="232" cy="490" r="7" fill="#227A86"/><circle cx="232" cy="490" r="7" fill="#8B73B7"/><text x="54" y="564" fill="#63788A" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start">Percentages compare the selected sets, not corpus prevalence.</text><rect x="667" y="223" width="14" height="14" rx="2" fill="#227A86"/><text x="688" y="235" fill="#18344A" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start">Known</text><rect x="794" y="223" width="14" height="14" rx="2" fill="#E1A35E"/><text x="815" y="235" fill="#18344A" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start">Missing</text><rect x="934" y="223" width="14" height="14" rx="2" fill="#CCD7DF"/><text x="955" y="235" fill="#18344A" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start">Not computed</text><text x="667" y="270" fill="#18344A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">Language</text><rect x="667" y="285" width="423" height="24" rx="0" fill="#227A86"/><rect x="1090" y="285" width="37.6" height="24" rx="0" fill="#E1A35E"/><rect x="1127.6" y="285" width="9.4" height="24" rx="0" fill="#CCD7DF"/><text x="1145" y="302" fill="#63788A" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start">100%</text><text x="667" y="336" fill="#18344A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">Documentary role</text><rect x="667" y="351" width="361.90000000000003" height="24" rx="0" fill="#227A86"/><rect x="1028.9" y="351" width="65.8" height="24" rx="0" fill="#E1A35E"/><rect x="1094.7" y="351" width="42.300000000000004" height="24" rx="0" fill="#CCD7DF"/><text x="1145" y="368" fill="#63788A" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start">100%</text><text x="667" y="402" fill="#18344A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">Subject domain</text><rect x="667" y="417" width="244.4" height="24" rx="0" fill="#227A86"/><rect x="911.4" y="417" width="98.7" height="24" rx="0" fill="#E1A35E"/><rect x="1010.1" y="417" width="126.9" height="24" rx="0" fill="#CCD7DF"/><text x="1145" y="434" fill="#63788A" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start">100%</text><text x="667" y="468" fill="#18344A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">Narrative style</text><rect x="667" y="483" width="117.5" height="24" rx="0" fill="#227A86"/><rect x="784.5" y="483" width="112.80000000000001" height="24" rx="0" fill="#E1A35E"/><rect x="897.3" y="483" width="239.70000000000002" height="24" rx="0" fill="#CCD7DF"/><text x="1145" y="500" fill="#63788A" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start">100%</text><text x="667" y="557" fill="#63788A" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start">Never treat unavailable or uncomputed values as zero.</text><text x="30" y="617" fill="#63788A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">Synthetic values for discussion and usability testing. Charts are candidates, not committed features.</text></svg>