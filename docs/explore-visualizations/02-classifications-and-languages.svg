<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="640" viewBox="0 0 1260 640" role="img" aria-label="Content classification and actual text languages"><title>Content classification and actual text languages — synthetic illustrative mockups</title><rect x="0" y="0" width="1260" height="640" rx="0" fill="#F4F8FA"/><rect x="30" y="24" width="64" height="27" rx="6" fill="#18344A"/><text x="62" y="43" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle">semANT</text><text x="110" y="45" fill="#63788A" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="start">EXPLORE  /  VISUALIZATION CONCEPTS</text><text x="30" y="91" fill="#18344A" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start">Content classification and actual text languages</text><text x="1230" y="90" fill="#63788A" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="end">ILLUSTRATIVE · NOT ACTUAL DATA</text><rect x="30" y="117" width="587" height="468" rx="14" fill="#FFFFFF" stroke="#DCE6EB" stroke-width="1"/><text x="54" y="158" fill="#18344A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start">Selectable content classification</text><text x="54" y="182" fill="#63788A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">Example dimension: subject domain; many other fields exist.</text><line x1="54" y1="199" x2="593" y2="199" stroke="#DCE6EB" stroke-width="1" /><rect x="643" y="117" width="587" height="468" rx="14" fill="#FFFFFF" stroke="#DCE6EB" stroke-width="1"/><text x="667" y="158" fill="#18344A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start">Bibliographic vs passage language</text><text x="667" y="182" fill="#63788A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">Two different properties — do not silently merge them.</text><line x1="667" y1="199" x2="1206" y2="199" stroke="#DCE6EB" stroke-width="1" /><rect x="54" y="221" width="136" height="30" rx="8" fill="#18344A"/><text x="122" y="241" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Subject domain</text><rect x="198" y="221" width="64" height="30" rx="8" fill="#F0F5F7"/><text x="230" y="241" fill="#18344A" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Genre</text><rect x="270" y="221" width="64" height="30" rx="8" fill="#F0F5F7"/><text x="302" y="241" fill="#18344A" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Style</text><rect x="342" y="221" width="104" height="30" rx="8" fill="#F0F5F7"/><text x="394" y="241" fill="#18344A" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Complexity</text><text x="54" y="301" fill="#18344A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">Politics</text><rect x="209" y="283" width="280" height="27" rx="5" fill="#ECF3F6"/><rect x="209" y="283" width="248" height="27" rx="5" fill="#227A86"/><text x="498" y="301" fill="#18344A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="start">62</text><text x="54" y="344" fill="#18344A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">Religion</text><rect x="209" y="326" width="280" height="27" rx="5" fill="#ECF3F6"/><rect x="209" y="326" width="172" height="27" rx="5" fill="#227A86"/><text x="498" y="344" fill="#18344A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="start">43</text><text x="54" y="387" fill="#18344A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400